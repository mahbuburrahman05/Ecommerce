<div class="max-w-7xl mx-auto px-6 py-10">

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
    <div class="lg:col-span-8 space-y-5">
      <h2 class="text-3xl font-bold mb-4">Products</h2>
      @for (item of Product$ | async; track item.id) {
      <div class="bg-white rounded-2xl shadow p-5 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <img src="{{ item.image }}" alt="{{ item.title }}" class="w-16 h-16 object-contain rounded-lg" />
          <div>
            <h3 class="font-semibold text-gray-900">
              {{ item.title }}
            </h3>
            <p class="text-sm text-gray-500">
              {{ item.category }}
            </p>
            <p class="text-indigo-600 font-bold">
              ${{ item.price }}
            </p>
          </div>
        </div>
        <div class="flex gap-3">
          <button (click)="onEdit(item)" class="bg-yellow-500 cursor-pointer text-white px-4 py-2 rounded-lg hover:bg-yellow-600">
            Edit
          </button>
          <button type="submit" (click)="deleteItem(item.id)"
            class="bg-red-500 cursor-pointer text-white px-4 py-2 rounded-lg hover:bg-red-600">
            Delete
          </button>
        </div>
      </div>
      }
    </div>
    <div class="lg:col-span-4">
      <div class="bg-white rounded-2xl shadow p-6 sticky top-6">
        <h2 class="text-2xl font-bold mb-6">
          Product Form
        </h2>
        <form [formGroup]="useForm" (ngSubmit)="onSaveUser()" class="space-y-4">
          <input required formControlName="title" type="text" placeholder="Title"
            class="w-full border p-3 rounded-xl" />
          <input required formControlName="price" type="number" placeholder="Price"
            class="w-full border p-3 rounded-xl" />
          <input required formControlName="category" type="text" placeholder="Category"
            class="w-full border p-3 rounded-xl" />
          <input required formControlName="image" type="text" placeholder="Image URL"
            class="w-full border p-3 rounded-xl" />
          <div class="flex gap-3">
            @if(isEditMode){
            <button type="button" (click)="onUpdateUser()"
              class="bg-green-600 text-white w-full py-2 cursor-pointer rounded-xl hover:bg-green-700">
              Update
            </button>
            } @else {
            <button type="submit" (click)="onSaveUser()"
              class="bg-indigo-600 text-white w-full cursor-pointer py-2 rounded-xl hover:bg-indigo-700">
              Save
            </button>
            }
            <button (click)="onClear()" type="button" class="bg-gray-200 w-full py-2 cursor-pointer rounded-xl">
              Clear
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
